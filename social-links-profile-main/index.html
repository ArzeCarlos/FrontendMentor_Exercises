<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="page">
    <main class="profile">
      <header class="profile__header">
        <img
          class="profile__avatar"
          src="./assets/images/avatar-jessica.jpeg"

        <h2 class="profile__name">Jessica Randall</h2>
        <h4 class="profile__location">London, United Kingdom</h4>
        <p class="profile__description">
          "Front-end developer and avid reader."
        </p>
      </header>

      <div class="profile__links">
        <a href="#" class="profile__link">GitHub</a>
        <a href="#" class="profile__link">Frontend Mentor</a>
        <a href="#" class="profile__link">LinkedIn</a>
        <a href="#" class="profile__link">Twitter</a>
        <a href="#" class="profile__link">Instagram</a>
      </div>
    </main>
  </body>
</html>
